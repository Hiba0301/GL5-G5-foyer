global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'jenkins'
    metrics_path: '/prometheus'
    static_configs:
      - targets: ['jenkins:8080']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Backend Spring Boot (conteneur foyer-app lancé par Jenkins sur le réseau devops)
  - job_name: 'tpfoyer'
    metrics_path: '/tpFoyer17/actuator/prometheus'
    static_configs:
      - targets: ['foyer-app:8082']
