server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Routing Angular : toute URL inconnue renvoie index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long pour les fichiers versionnés (hash dans le nom)
    location ~* \.(js|css|ico|png|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
