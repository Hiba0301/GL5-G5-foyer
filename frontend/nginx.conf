server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Transmettre les requêtes API au backend Spring Boot
    location /tpFoyer17/ {
        proxy_pass http://foyer-app-service:8082;

        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }


    # Routing Angular : toute URL inconnue renvoie index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache long pour les fichiers versionnés (hash dans le nom)
    location ~* \.(js|css|ico|png|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
